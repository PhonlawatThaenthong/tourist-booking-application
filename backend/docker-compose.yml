services:
  api:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      # Inside the compose network the API talks to the container ports
      # directly, so these override whatever .env says for host access.
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Slip uploads live on a named volume so they survive redeploys.
      UPLOAD_DIR: /app/uploads
      # Overrides the `development` in .env — without this, every error from
      # the deployed API lands in Sentry tagged as if it came from a laptop.
      SENTRY_ENVIRONMENT: production
      # Ties an issue to the exact commit that produced it, which is what
      # makes "which deploy introduced this?" answerable. Export it before
      # `docker compose up`:
      #   SENTRY_RELEASE=$(git rev-parse HEAD) docker compose up -d --build
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Same host-vs-container split as DB_HOST. No depends_on: the chatbot
      # is optional (profile below) and the API answers 503 while it is down.
      CHATBOT_URL: http://chatbot:8000
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-poonsuk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-poonsuk}
    ports:
      # Host 5433 -> container 5432. 5432 on the host is taken by another
      # PostgreSQL, so DB_PORT in .env must be 5433 when running the API
      # from Windows. Bound to 127.0.0.1 so the database is never reachable
      # from the network, only from this machine and the compose network.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-poonsuk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reserved for Sprint 3 (cache / distributed lock / BullMQ broker).
  # Started now so compose does not need changing later.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    environment:
      # Picked up by redis-cli, so the healthcheck authenticates without
      # putting the password on its command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The chatbot (FastAPI + RAG) from the separate Chatbot_Project repo,
  # cloned next to this one at project_booking/Chatbot_Project — hence the
  # ../../ paths (this file lives in backend/).
  #
  # Behind a profile so a plain `docker compose up` still works for anyone
  # without that repo, a Typhoon key or a built chroma_db. To include it:
  #   docker compose --profile chatbot up -d --build
  chatbot:
    profiles: ["chatbot"]
    build: ../../Chatbot_Project/resort-chatbot-api
    env_file: ../../Chatbot_Project/resort-chatbot-api/.env
    environment:
      BOOKING_API_BASE_URL: http://api:3000/api
      # `:-`, never `:?` — compose interpolates the whole file even when this
      # profile is off, so `:?` would stop people without a key from running
      # compose at all.
      BOOKING_API_INTERNAL_KEY: ${CHATBOT_INTERNAL_KEY:-}
    ports:
      # Loopback only: lets this machine open /demo, but the chatbot's
      # /api/v1/knowledge write endpoints have no auth yet, so it must not be
      # reachable from the network. The app goes through /api/chatbot/query.
      - "127.0.0.1:8000:8000"
    volumes:
      # Read-only, at the path the chatbot's DEFAULT_CHROMA_PATH resolves to
      # (/app/../indexing-pipeline/chroma_db).
      - ../../Chatbot_Project/indexing-pipeline/chroma_db:/indexing-pipeline/chroma_db:ro
      # Keeps the ~1 GB embedding model across container rebuilds.
      - chatbot-hf-cache:/root/.cache/huggingface
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  chatbot-hf-cache:
