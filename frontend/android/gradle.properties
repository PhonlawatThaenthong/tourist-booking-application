org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler crashes on Windows when the project and
# the pub cache live on different drive letters (RelocatableFileToPathConverter
# can't compute a relative path across drives -> "this and base files have
# different roots"). Affects patrol/sentry_flutter/package_info_plus/etc.
# See https://github.com/flutter/flutter/issues/171431. Disable incremental
# Kotlin compilation to work around it (slower clean builds, but it builds).
kotlin.incremental=false
