# Host Nginx site for the Poonsuk API  ->  /etc/nginx/sites-available/poonsuk-api
# __DOMAIN__ is replaced by deploy/setup-vm.sh (e.g. api.example.com).
# The certificate is issued by certbot (webroot) BEFORE this file is enabled,
# because nginx refuses to start when ssl_certificate points at a missing file.
# Written for nginx 1.24 (Ubuntu 24.04): `listen ... http2` instead of `http2 on;`.

upstream poonsuk_api {
    # Future: add 127.0.0.1:3001 etc. when api runs as several replicas.
    server 127.0.0.1:3000;
    keepalive 16;
}

# Port 80: ACME challenge for renewals + redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Slip and room/restaurant images are capped at 5 MB in the API
    # (PAYMENT_MAX_SLIP_BYTES / IMAGE_MAX_BYTES). nginx's default is 1 MB,
    # which would reject uploads with 413 before Nest ever sees them.
    # Raise this together with those env values.
    client_max_body_size 6m;

    location / {
        proxy_pass http://poonsuk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, don't append: the API trusts exactly one hop
        # (TRUST_PROXY=1), so a client-supplied X-Forwarded-For must not survive.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
