# Host Nginx site for the Poonsuk API  ->  /etc/nginx/sites-available/poonsuk-api
# __DOMAIN__ is replaced by deploy/setup-vm.sh (e.g. api.example.com).
# The certificate is issued by certbot (webroot) BEFORE this file is enabled,
# because nginx refuses to start when ssl_certificate points at a missing file.
# Written for nginx 1.24 (Ubuntu 24.04): `listen ... http2` instead of `http2 on;`.

# Which replica served each request (up=...). Lets you check the balancing:
#   sudo tail -f /var/log/nginx/poonsuk-api.access.log
log_format poonsuk_upstream '$remote_addr [$time_local] "$request" $status '
                            'up=$upstream_addr ut=$upstream_response_time rt=$request_time';

# Two api replicas from backend/docker-compose.prod.yml (api, api-2).
# least_conn, not round robin: request cost varies a lot (cached GET /rooms
# vs. a reports query or a 5 MB slip upload). No sticky sessions needed:
# JWTs are stateless and throttle/cache/lock state is in Redis.
# max_fails/fail_timeout = passive health check (open-source nginx has no
# active one): a replica that refuses connections during its swap is skipped
# for 10s.
upstream poonsuk_api {
    least_conn;
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# Port 80: ACME challenge for renewals + redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Slip and room/restaurant images are capped at 5 MB in the API
    # (PAYMENT_MAX_SLIP_BYTES / IMAGE_MAX_BYTES). nginx's default is 1 MB,
    # which would reject uploads with 413 before Nest ever sees them.
    # Raise this together with those env values.
    client_max_body_size 6m;

    location / {
        proxy_pass http://poonsuk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, don't append: the API trusts exactly one hop
        # (TRUST_PROXY=1), so a client-supplied X-Forwarded-For must not survive.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        access_log /var/log/nginx/poonsuk-api.access.log poonsuk_upstream;

        # A replica being swapped refuses connections: retry on the other one.
        # POST/PATCH are never retried (no `non_idempotent`), so a booking is
        # never sent twice. http_503 is left out on purpose: the API returns
        # 503 itself when a booking lock wait times out (LOCK_WAIT_MS).
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}
