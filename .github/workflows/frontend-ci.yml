name: Frontend CI

on:
  push:
    branches: ['**']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # APK build ต้องใช้ JDK — runner มีให้ แต่ระบุเวอร์ชันไว้กัน default เปลี่ยน
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # pubspec.lock ระบุ flutter >=3.44.0 / dart >=3.12.2 — stable ครอบคลุมอยู่แล้ว
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # secrets.SENTRY_DSN ยังไม่ได้ตั้งก็ไม่พัง — ค่าว่างแปลว่า Sentry ปิดสนิท
      # (ดู AppConfig.sentryDsn) พอใส่ secret เมื่อไหร่ APK ก็รายงานทันที
      # SENTRY_RELEASE = commit SHA → issue ผูกกลับไปหา commit ที่ทำพังได้
      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=SENTRY_ENVIRONMENT=ci \
            --dart-define=SENTRY_RELEASE=${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
